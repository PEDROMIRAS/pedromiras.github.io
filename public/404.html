<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found - Pedro Miras</title>
    <!-- Página estática: GitHub Pages la sirve para cualquier ruta que no exista, a cualquier profundidad.
         Por eso los enlaces son absolutos y los estilos van aquí dentro, sin depender del build de React.
         shortcut: asume el sitio en la raíz del dominio (pedromiras.github.io); si se publica en una subcarpeta, cambiar "/" -->
    <link rel="icon" href="/assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            background: #090909;
        }

        .codigo {
            font-family: 'Geist', sans-serif;
            font-weight: 600;
            font-size: clamp(5rem, 22vw, 10rem);
            line-height: 1;
            letter-spacing: -0.06em;
            color: #ffffff;
        }

        h1 {
            font-family: 'Geist', sans-serif;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            color: #999999;
        }

        p {
            max-width: 480px;
            line-height: 1.8;
            color: #999999;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 20px;
            border-radius: 100px;
            font-weight: 500;
            text-decoration: none;
            color: #000000;
            background-color: #ffffff;
            transition: background-color 0.2s ease;
        }

        a:hover {
            background-color: #e6e6e6;
        }

        a:focus-visible {
            outline: 3px solid #0099ff;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for doesn’t exist or has been moved.</p>
    <a href="/">Back to the portfolio</a>
</body>
</html>
